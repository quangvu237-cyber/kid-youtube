services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    image: laravel-app-dev
    container_name: laravel-dev
    volumes:
      - .:/var/www
    working_dir: /var/www
    ports:
      - "9000:9000"
    environment:
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_REVALIDATE_FREQ=0
    networks:
      - laravel
    depends_on:
      - node
      - redis
    user: "${UID:-1000}:${GID:-1000}"

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile.dev
    image: node-app-dev
    container_name: node-dev
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - laravel
    user: "${UID:-1000}:${GID:-1000}"

  redis:
    image: redis:alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/dev.default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

networks:
  laravel:
    driver: bridge