services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: laravel-app
    container_name: laravel-boilerplate
    volumes:
      - .:/var/www
    working_dir: /var/www
    ports:
      - "9000:9000"
    networks:
      - laravel
    depends_on:
      - node
    user: "${UID:-1000}:${GID:-1000}"

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    image: node-app
    container_name: node-boilerplate
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - laravel
    user: "${UID:-1000}:${GID:-1000}"

  redis:
    image: redis:alpine
    container_name: redis-boilerplate
    ports:
      - "6379:6379"
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: nginx-boilerplate
    ports:
      - "8080:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
